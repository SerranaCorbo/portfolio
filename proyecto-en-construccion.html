<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Próximamente — Serrana Corbo</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0F2F8;--surface:rgba(255,255,255,0.72);--border:rgba(255,255,255,0.88);
  --border-sm:rgba(180,190,220,0.32);
  --shadow-lg:0 20px 64px rgba(80,100,180,0.16);
  --cyan:#0891B2;--lav:#7C3AED;
  --text:#1A1D2E;--text2:#4B5563;--text3:#9CA3AF;--white:#FFFFFF;
  --grad:linear-gradient(135deg,var(--cyan) 0%,var(--lav) 100%);
  --font-title:'Satoshi',sans-serif;--font-body:'Manrope',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;}
body{
  background:var(--bg);color:var(--text);font-family:var(--font-body);
  overflow-x:hidden;cursor:none;
  min-height:100vh;
  display:flex;flex-direction:column;
}

.cursor-dot{width:6px;height:6px;border-radius:50%;background:var(--lav);position:fixed;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .18s,height .18s;}
.cursor-ring{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(124,58,237,0.35);position:fixed;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .22s,height .22s,border-color .22s;}
@media(hover:none){body{cursor:auto;}.cursor-dot,.cursor-ring{display:none;}}

.bg-mesh{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.orb{position:absolute;border-radius:50%;will-change:transform;}
.orb-1{width:700px;height:700px;background:radial-gradient(circle,rgba(8,145,178,0.13) 0%,transparent 70%);top:-200px;left:-100px;animation:drift 22s ease-in-out infinite;}
.orb-2{width:600px;height:600px;background:radial-gradient(circle,rgba(124,58,237,0.09) 0%,transparent 70%);bottom:-150px;right:-100px;animation:drift 28s ease-in-out infinite reverse;}
.orb-3{width:420px;height:420px;background:radial-gradient(circle,rgba(59,130,246,0.07) 0%,transparent 70%);top:45%;left:55%;animation:drift 18s ease-in-out infinite 6s;}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(40px,-30px) scale(1.05);}66%{transform:translate(-20px,20px) scale(.97);}}

header{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(240,242,248,0.82);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border-bottom:1px solid var(--border-sm);box-shadow:0 2px 20px rgba(100,120,200,0.06);}
nav{max-width:1280px;margin:0 auto;display:flex;align-items:center;padding:0 60px;height:72px;}
.nav-logo-slot{display:flex;align-items:center;justify-content:center;width:40px;height:40px;flex-shrink:0;border:1.5px dashed rgba(124,58,237,0.28);border-radius:8px;color:var(--text3);font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:0.05em;text-decoration:none;transition:border-color .25s,color .25s;}
.nav-logo-slot:hover{border-color:var(--lav);color:var(--lav);}
.nav-links{display:flex;gap:36px;list-style:none;margin-left:auto;}
.nav-links a{font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--text2);text-decoration:none;letter-spacing:0.01em;transition:color .22s;}
.nav-links a:hover{color:var(--lav);}

.page-content{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  padding:110px 24px 80px;
  position:relative;z-index:1;
}

.card{
  background:var(--surface);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--border);
  border-radius:28px;
  padding:52px 48px 48px;
  max-width:480px;width:100%;
  text-align:center;
  box-shadow:var(--shadow-lg);
  position:relative;
  overflow:hidden;
  animation:cardIn .9s cubic-bezier(.22,.68,0,1.2) forwards;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);border-radius:28px 28px 0 0;overflow:hidden;}
@keyframes cardIn{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}

.icon-wrap{
  width:68px;height:68px;border-radius:18px;
  background:rgba(124,58,237,0.07);
  border:1px solid rgba(124,58,237,0.14);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 28px;
  color:var(--lav);
  animation:iconFloat 4s ease-in-out infinite;
}
@keyframes iconFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:var(--cyan);letter-spacing:0.16em;text-transform:uppercase;margin-bottom:14px;opacity:0;animation:fadeUp .7s ease .3s forwards;}
.eyebrow::before{content:'';display:block;width:20px;height:1.5px;background:var(--cyan);border-radius:2px;}
.title{font-family:var(--font-title);font-size:clamp(26px,4vw,36px);font-weight:700;line-height:1.1;letter-spacing:-0.03em;color:var(--text);margin-bottom:14px;opacity:0;animation:fadeUp .7s ease .42s forwards;}
.title span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.desc{font-size:14.5px;font-weight:300;line-height:1.75;color:var(--text2);margin-bottom:32px;opacity:0;animation:fadeUp .7s ease .54s forwards;}

.progress-wrap{margin-bottom:32px;opacity:0;animation:fadeUp .7s ease .64s forwards;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:9px;}
.progress-label span:last-child{color:var(--lav);font-weight:700;}
.progress-track{height:4px;background:rgba(124,58,237,0.08);border-radius:100px;overflow:hidden;}
.progress-fill{height:100%;width:0%;border-radius:100px;background:var(--grad);animation:fillBar 1.8s cubic-bezier(.4,0,.2,1) 1s forwards;}
@keyframes fillBar{to{width:65%;}}

.back-btn{display:inline-flex;align-items:center;gap:9px;padding:13px 30px;border-radius:100px;font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--white);text-decoration:none;background:var(--grad);box-shadow:0 6px 24px rgba(8,145,178,0.22);transition:box-shadow .3s,transform .3s;position:relative;overflow:hidden;will-change:transform;opacity:0;animation:fadeUp .7s ease .76s forwards;}
.back-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--lav),var(--cyan));opacity:0;transition:opacity .4s;}
.back-btn:hover::before{opacity:1;}
.back-btn:hover{box-shadow:0 12px 36px rgba(124,58,237,0.32);transform:translateY(-2px);}
.back-btn span,.back-btn svg{position:relative;z-index:1;}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

footer{position:relative;z-index:1;padding:64px 40px;border-top:1px solid rgba(160,175,220,0.30);display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;background:#1A1D2E;}
.footer-name{font-family:var(--font-title);font-size:13px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0.95;}
.footer-icons{display:flex;gap:28px;align-items:center;}
.footer-icon{display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.35);text-decoration:none;transition:color .25s,transform .25s;}
.footer-icon:hover{color:rgba(255,255,255,0.85);transform:translateY(-3px);}
.footer-tagline{font-family:var(--font-body);font-size:12px;color:rgba(255,255,255,0.28);letter-spacing:0.1em;text-transform:uppercase;}

@media(max-width:768px){body{cursor:auto;}.cursor-dot,.cursor-ring{display:none;}nav{padding:0 24px;height:64px;}.nav-links{gap:18px;}.nav-links a{font-size:13px;}.card{padding:36px 24px;}footer{padding:48px 24px;}}
</style>
</head>
<body>

<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="bg-mesh">
  <div class="orb orb-1" id="orb1"></div>
  <div class="orb orb-2" id="orb2"></div>
  <div class="orb orb-3" id="orb3"></div>
</div>

<header>
  <nav>
    <a href="index.html" class="nav-logo-slot">SC</a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="index.html#about">Sobre mí</a></li>
      <li><a href="index.html#work">Proyectos</a></li>
      <li><a href="index.html#contact">Contacto</a></li>
    </ul>
  </nav>
</header>

<div class="page-content">
  <div class="card">

    <div class="icon-wrap">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
    </div>

    <div class="eyebrow">Proyecto en proceso</div>

    <h1 class="title"><span>Próximamente</span></h1>

    <p class="desc">Este proyecto está en camino — actualmente trabajando en la documentación y presentación final. Volvé pronto para verlo completo.</p>

    <div class="progress-wrap">
      <div class="progress-label"><span>Progreso</span><span>65%</span></div>
      <div class="progress-track"><div class="progress-fill"></div></div>
    </div>

    <a href="index.html" class="back-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span>Volver al portfolio</span>
    </a>

  </div>
</div>

<footer>
  <span class="footer-name">Serrana Corbo</span>
  <div class="footer-icons">
    <a href="https://www.linkedin.com/in/serrana-corbo-a5436225b/" target="_blank" class="footer-icon" aria-label="LinkedIn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg></a>
    <a href="#" class="footer-icon" aria-label="Instagram"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>
    <a href="#" class="footer-icon" aria-label="WhatsApp"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></a>
  </div>
  <span class="footer-tagline">Diseño Industrial + UX · UI</span>
</footer>

<script src="lang.js"></script>
<script>
var dot=document.getElementById('cursorDot'),ring=document.getElementById('cursorRing'),mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
(function ar(){rx+=(mx-rx)*.13;ry+=(my-ry)*.13;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(ar);})();
document.querySelectorAll('a,button').forEach(function(el){
  el.addEventListener('mouseenter',function(){ring.style.width='46px';ring.style.height='46px';ring.style.borderColor='rgba(124,58,237,0.6)';dot.style.width='10px';dot.style.height='10px';});
  el.addEventListener('mouseleave',function(){ring.style.width='28px';ring.style.height='28px';ring.style.borderColor='rgba(124,58,237,0.35)';dot.style.width='6px';dot.style.height='6px';});
});
var orbData=[{el:document.getElementById('orb1'),mx:-0.025,my:-0.018,sx:-0.045},{el:document.getElementById('orb2'),mx:0.020,my:0.022,sx:0.055},{el:document.getElementById('orb3'),mx:-0.014,my:0.016,sx:-0.032}];
var pMx=0,pMy=0,pSy=0;
document.addEventListener('mousemove',function(e){pMx=e.clientX-window.innerWidth/2;pMy=e.clientY-window.innerHeight/2;},{passive:true});
window.addEventListener('scroll',function(){pSy=window.scrollY;},{passive:true});
(function ao(){orbData.forEach(function(o){if(!o.el)return;o.el.style.transform='translate('+(pMx*o.mx)+'px,'+(pMy*o.my+pSy*o.sx)+'px)';});requestAnimationFrame(ao);})();
</script>
</body>
</html>

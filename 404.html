<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Serrana Corbo</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-warm:#F5F4F0;
  --border-sm:rgba(180,190,220,0.32);
  --cyan:#0891B2;--lav:#7C3AED;
  --text:#1A1D2E;--text2:#4B5563;--text3:#9CA3AF;
  --white:#FFFFFF;
  --grad:linear-gradient(135deg,#0891B2 0%,#7C3AED 100%);
  --font-serif:'DM Serif Display',serif;
  --font-title:'Satoshi',sans-serif;
  --font-body:'Manrope',sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;}
body{background:#1A1D2E;color:var(--text);font-family:var(--font-body);cursor:none;
  display:flex;flex-direction:column;}

/* CURSOR */
.cursor-dot{width:6px;height:6px;border-radius:50%;background:var(--lav);position:fixed;
  pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:width .18s,height .18s;}
.cursor-ring{width:28px;height:28px;border-radius:50%;border:1.5px solid rgba(124,58,237,0.35);
  position:fixed;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);
  transition:width .22s,height .22s,border-color .22s;}
.cursor-ring.hovering{width:46px;height:46px;border-color:rgba(124,58,237,0.6);}
@media(hover:none){body{cursor:auto;}.cursor-dot,.cursor-ring{display:none;}}

/* NAVBAR */
header{position:fixed;top:0;left:0;right:0;z-index:200;
  background:rgba(245,244,240,0.85);backdrop-filter:blur(24px) saturate(1.8);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);
  border-bottom:1px solid var(--border-sm);}
nav{max-width:1280px;margin:0 auto;display:flex;align-items:center;padding:0 60px;height:72px;}
.nav-logo-slot{display:flex;align-items:center;justify-content:center;width:40px;height:40px;
  border:1.5px dashed rgba(124,58,237,0.28);border-radius:8px;color:var(--text3);
  font-size:8px;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;
  transition:border-color .25s,color .25s;}
.nav-logo-slot:hover{border-color:var(--lav);color:var(--lav);}
.nav-links{display:flex;gap:36px;list-style:none;margin-left:auto;}
.nav-links a{font-size:14px;font-weight:500;color:var(--text2);
  text-decoration:none;transition:color .22s;}
.nav-links a:hover{color:var(--lav);}

/* CONTENIDO */
.page-404{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:72px 40px 40px;position:relative;overflow:hidden;}

/* Fondo con noise */
.page-404::before{content:'';position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  opacity:.4;mix-blend-mode:overlay;pointer-events:none;z-index:0;}

/* El 404 que sigue el cursor */
.num-interactive{position:absolute;font-family:var(--font-serif);font-style:italic;
  font-size:clamp(200px,28vw,380px);font-weight:400;line-height:1;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;opacity:0.08;user-select:none;pointer-events:none;
  letter-spacing:-0.05em;z-index:0;
  transition:transform .15s cubic-bezier(.22,.68,0,1.1),opacity .3s;
  will-change:transform;}
.num-interactive.visible{opacity:0.10;}

/* Contenido central */
.content-404{position:relative;z-index:1;display:flex;flex-direction:column;
  align-items:center;gap:0;text-align:center;
  opacity:0;animation:fadeUp .8s cubic-bezier(.22,.68,0,1.1) .1s both;}

.label-404{font-size:11px;font-weight:600;letter-spacing:0.22em;text-transform:uppercase;
  color:rgba(8,145,178,0.8);display:inline-flex;align-items:center;gap:10px;margin-bottom:24px;}
.label-404::before,.label-404::after{content:'';display:block;width:22px;height:1.5px;
  background:rgba(8,145,178,0.5);border-radius:2px;}

.num-404{font-family:var(--font-serif);font-style:italic;
  font-size:clamp(96px,16vw,180px);font-weight:400;line-height:.9;
  letter-spacing:-0.04em;color:var(--white);margin-bottom:4px;}

.title-404{font-family:var(--font-title);font-size:clamp(20px,3vw,28px);
  font-weight:700;color:var(--white);letter-spacing:-0.02em;margin-bottom:16px;}
.title-404 span{background:var(--grad);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;}

.sub-404{font-size:16px;font-weight:300;line-height:1.7;color:rgba(255,255,255,0.5);
  max-width:420px;margin-bottom:40px;}

.btn-home{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;
  background:var(--grad);border-radius:100px;font-size:13px;font-weight:600;
  color:var(--white);text-decoration:none;transition:box-shadow .3s,transform .3s;}
.btn-home:hover{box-shadow:0 8px 24px rgba(8,145,178,0.35);transform:translateY(-2px);}
.btn-home svg{transition:transform .25s;}
.btn-home:hover svg{transform:translateX(-3px);}

/* Partículas decorativas */
.particle{position:absolute;border-radius:50%;pointer-events:none;opacity:0;
  animation:float var(--dur) ease-in-out var(--delay) infinite;}
@keyframes float{
  0%,100%{opacity:0;transform:translateY(0) scale(1);}
  20%{opacity:var(--op);}
  80%{opacity:var(--op);}
  100%{opacity:0;transform:translateY(-60px) scale(0.8);}
}

.line-404{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:12px;opacity:0;
  animation:fadeUp .8s ease .5s both;}
.line-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,0.15);}
.line-txt{font-size:11px;color:rgba(255,255,255,0.25);letter-spacing:0.1em;}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

@media(max-width:768px){
  body{cursor:auto;}.cursor-dot,.cursor-ring{display:none;}
  nav{padding:0 24px;}.nav-links{display:none;}
  .num-interactive{display:none;}
}
</style>
</head>
<body>
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<header>
  <nav>
    <a href="index.html" class="nav-logo-slot"><span>logo</span></a>
    <ul class="nav-links">
      <li><a href="index.html#hero">Inicio</a></li>
      <li><a href="index.html#about">Sobre mí</a></li>
      <li><a href="index.html#work">Proyectos</a></li>
      <li><a href="index.html#contact">Contacto</a></li>
    </ul>
  </nav>
</header>

<main class="page-404">
  <!-- El 404 que sigue el cursor -->
  <div class="num-interactive" id="num404" aria-hidden="true">404</div>

  <!-- Partículas flotantes -->
  <div class="particle" style="width:6px;height:6px;background:rgba(8,145,178,0.4);top:30%;left:15%;--dur:4s;--delay:0s;--op:0.6;"></div>
  <div class="particle" style="width:4px;height:4px;background:rgba(124,58,237,0.4);top:60%;left:80%;--dur:5s;--delay:1s;--op:0.5;"></div>
  <div class="particle" style="width:8px;height:8px;background:rgba(8,145,178,0.25);top:20%;left:70%;--dur:6s;--delay:2s;--op:0.4;"></div>
  <div class="particle" style="width:3px;height:3px;background:rgba(124,58,237,0.5);top:75%;left:25%;--dur:4.5s;--delay:0.5s;--op:0.6;"></div>
  <div class="particle" style="width:5px;height:5px;background:rgba(8,145,178,0.35);top:45%;left:88%;--dur:5.5s;--delay:1.5s;--op:0.5;"></div>

  <div class="content-404">
    <div class="label-404">Error de navegación</div>
    <div class="num-404">404</div>
    <h1 class="title-404">Esta página <span>no existe.</span></h1>
    <p class="sub-404">El link que seguiste llegó a un lugar vacío. Mové el cursor si no me creés — y después volvé al inicio.</p>
    <a href="index.html" class="btn-home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Volver al inicio
    </a>
  </div>

  <div class="line-404">
    <div class="line-dot"></div>
    <span class="line-txt">Serrana Corbo · Diseño Industrial + UX/UI</span>
    <div class="line-dot"></div>
  </div>
</main>

<script src="lang.js"></script>
<script>
// CURSOR
var dot=document.getElementById('cursorDot'),ring=document.getElementById('cursorRing'),mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
(function ar(){rx+=(mx-rx)*.13;ry+=(my-ry)*.13;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(ar);})();
document.querySelectorAll('a,.btn-home').forEach(function(el){
  el.addEventListener('mouseenter',function(){ring.classList.add('hovering');});
  el.addEventListener('mouseleave',function(){ring.classList.remove('hovering');});
});

// 404 QUE SIGUE EL CURSOR — con inercia suave
var num = document.getElementById('num404');
var cx = window.innerWidth/2, cy = window.innerHeight/2;
var tx = cx, ty = cy;
var hasMoused = false;

document.addEventListener('mousemove', function(e){
  if(!hasMoused){ num.classList.add('visible'); hasMoused = true; }
  tx = e.clientX;
  ty = e.clientY;
});

(function animNum(){
  // Inercia suave — el número va hacia el cursor pero con lag
  cx += (tx - cx) * 0.06;
  cy += (ty - cy) * 0.06;
  // Offset para que el número esté centrado pero ligeramente desfasado
  var offsetX = cx - window.innerWidth * 0.5;
  var offsetY = cy - window.innerHeight * 0.5;
  num.style.transform = 'translate(calc(-50% + ' + offsetX * 0.18 + 'px), calc(-50% + ' + offsetY * 0.18 + 'px))';
  num.style.left = '50%';
  num.style.top = '50%';
  requestAnimationFrame(animNum);
})();
</script>
</body>
</html>
